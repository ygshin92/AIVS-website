name: Update Home Activity Media

on:
  push:
    branches:
      - main
    paths:
      - "assets/img/activity/**"
      - "tools/generate_home_media.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-home-media:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate recent activity list
        run: python tools/generate_home_media.py

      - name: Commit updated media list
        run: |
          if [ -z "$(git status --porcelain -- assets/home_media.json)" ]; then
            echo "Home media list is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/home_media.json
          git commit -m "chore: update home activity media"
          git push

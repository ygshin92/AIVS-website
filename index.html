<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIVS Lab</title>
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    :root{
      --home-accent: #880000;
      --home-section-title: 28px;
      --home-body-size: 16px;
    }

    main.container{
      padding: 0 0 56px;
    }

    /* =========================================================
       HOME ACTIVITY CAROUSEL
       - 4:3 / 3:2 / 16:9 landscape photos only
       - 3:2 frame is a visual compromise between 4:3 and 16:9
       - photos are resized to fit; no cropping
       ========================================================= */
    .home-carousel-section{
      padding-top: 28px;
    }

    .home-carousel{
      position: relative;
      width: min(860px, 100%);
      aspect-ratio: 3 / 2;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(26, 26, 26, 0.08);
      border-radius: 16px;
      background: #f5f5f5;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.08);
    }

    .carousel-track{
      position: relative;
      width: 100%;
      height: 100%;
    }

    .carousel-slide{
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease;
    }

    .carousel-slide.is-active{
      opacity: 1;
      visibility: visible;
      z-index: 1;
    }

    .carousel-slide img{
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .carousel-control{
      position: absolute;
      top: 50%;
      z-index: 5;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      transform: translateY(-50%);
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.30);
      color: #fff;
      font-size: 27px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .carousel-control:hover{
      background: rgba(0, 0, 0, 0.48);
    }

    .carousel-control:active{
      transform: translateY(-50%) scale(0.96);
    }

    .carousel-prev{ left: 14px; }
    .carousel-next{ right: 14px; }

    .carousel-dots{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 13px;
    }

    .carousel-dot{
      width: 8px;
      height: 8px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: rgba(136, 0, 0, 0.24);
      cursor: pointer;
      transition: width 0.18s ease, background 0.18s ease;
    }

    .carousel-dot.is-active{
      width: 22px;
      background: var(--home-accent);
    }

    .carousel-control:focus-visible,
    .carousel-dot:focus-visible{
      outline: 3px solid rgba(136, 0, 0, 0.30);
      outline-offset: 3px;
    }

    /* =========================================================
       NEWS
       ========================================================= */
    .news{
      width: min(900px, 100%);
      margin: 50px auto 0;
    }

    .home-section-title{
      margin: 0 0 16px;
      font-size: var(--home-section-title);
      font-weight: 900;
      line-height: 1.2;
    }

    .news-list{
      border-top: 1px solid rgba(26, 26, 26, 0.16);
    }

    .news-item{
      border-bottom: 1px solid rgba(26, 26, 26, 0.13);
    }

    .news-summary{
      list-style: none;
      display: grid;
      grid-template-columns: 92px 1fr 24px;
      gap: 16px;
      align-items: center;
      padding: 20px 2px;
      cursor: pointer;
      user-select: none;
    }

    .news-summary::-webkit-details-marker{
      display: none;
    }

    .news-date{
      font-size: 14px;
      font-weight: 800;
      color: rgba(136, 0, 0, 0.82);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    .news-title{
      font-size: 18px;
      font-weight: 800;
      line-height: 1.45;
      color: var(--text);
    }

    .news-chevron{
      width: 9px;
      height: 9px;
      justify-self: end;
      border-right: 2px solid rgba(26, 26, 26, 0.58);
      border-bottom: 2px solid rgba(26, 26, 26, 0.58);
      transform: rotate(45deg) translateY(-2px);
      transition: transform 0.18s ease;
    }

    .news-item[open] .news-chevron{
      transform: rotate(225deg) translate(-2px, -2px);
    }

    .news-detail{
      padding: 0 48px 20px 110px;
      font-size: var(--home-body-size);
      line-height: 1.75;
      color: var(--muted);
    }

    .news-detail p{
      margin: 0;
    }

    .news-detail strong{
      color: var(--text);
    }

    .news-summary:focus-visible{
      outline: 2px solid rgba(136, 0, 0, 0.35);
      outline-offset: -2px;
      border-radius: 8px;
    }



    .news-summary-main{
      min-width: 0;
    }

    .news-title-row{
      display: flex;
      align-items: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .news-badge{
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(136, 0, 0, 0.10);
      color: var(--home-accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.25px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .news-category{
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.15px;
    }

    .news-paper-title{
      margin: 0 0 8px;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
      line-height: 1.55;
    }

    .news-venue{
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }

    .news-paper-list{
      margin: 10px 0 0;
      padding-left: 20px;
    }

    .news-paper-list li{
      margin: 4px 0;
    }

    .news-links{
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-top: 12px;
    }

    .news-links a,
    .view-all-news{
      color: var(--home-accent);
      font-weight: 800;
      text-decoration: none;
      border-bottom: 1px solid rgba(136, 0, 0, 0.28);
    }

    .news-links a:hover,
    .view-all-news:hover{
      border-bottom-color: rgba(136, 0, 0, 0.75);
    }

    .news-footer-link{
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    @media (max-width: 900px){
      .home-carousel-section{
        padding-top: 20px;
      }

      .home-carousel{
        width: min(760px, 100%);
      }

      .news{
        margin-top: 42px;
      }
    }

    @media (max-width: 620px){
      main.container{
        padding-bottom: 42px;
      }

      .home-carousel{
        width: 100%;
        aspect-ratio: 4 / 3;
        border-radius: 13px;
      }

      .carousel-control{
        width: 36px;
        height: 36px;
        font-size: 23px;
      }

      .carousel-prev{ left: 9px; }
      .carousel-next{ right: 9px; }

      .carousel-dots{
        margin-top: 10px;
      }

      .news{
        margin-top: 34px;
      }

      .home-section-title{
        font-size: 24px;
      }

      .news-summary{
        grid-template-columns: 1fr 22px;
        gap: 7px 12px;
        padding: 17px 0;
      }

      .news-date{
        grid-column: 1;
        grid-row: 1;
        font-size: 13px;
      }

      .news-title{
        grid-column: 1;
        grid-row: 2;
        font-size: 17px;
      }

      .news-chevron{
        grid-column: 2;
        grid-row: 1 / span 2;
      }

      .news-detail{
        padding: 0 34px 18px 0;
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce){
      .carousel-slide,
      .carousel-control,
      .carousel-dot,
      .news-chevron{
        transition: none;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">
        <img class="brand-logo" src="assets/img/logo.png" alt="AIVS Lab Logo" />
        <span class="brand-text">AIVS</span>
      </a>

      <nav class="nav">
        <a class="active" href="index.html">Home</a>
        <a href="members.html">Members</a>
        <a href="research.html">Research</a>
        <a href="publications.html">Publications</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section
      class="home-carousel-section"
      id="homeCarouselSection"
      aria-label="Recent AIVS Lab Activities"
    >
      <div
        class="home-carousel"
        id="homeCarousel"
        role="region"
        tabindex="0"
        aria-roledescription="carousel"
        aria-label="Recent AIVS Lab activity photos"
      >
        <div class="carousel-track" id="carouselTrack"></div>

        <button
          class="carousel-control carousel-prev"
          id="carouselPrev"
          type="button"
          aria-label="Previous photo"
        >&#8249;</button>

        <button
          class="carousel-control carousel-next"
          id="carouselNext"
          type="button"
          aria-label="Next photo"
        >&#8250;</button>
      </div>

      <div
        class="carousel-dots"
        id="carouselDots"
        aria-label="Choose an activity photo"
      ></div>
    </section>

    <section class="news" aria-labelledby="newsTitle">
      <h2 class="home-section-title" id="newsTitle">News</h2>
      <div class="news-list" id="homeNewsList"></div>
      <div class="news-footer-link">
        <a class="view-all-news" href="news.html">View all news &rarr;</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> AIVS Lab. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/news_data_v1.js"></script>

  <script>
    const HOME_NEWS_LIMIT = 12;
    const HOME_MEDIA_JSON = "assets/home_media.json";
    const MAX_HOME_MEDIA = 6;
    const MIN_HOME_RATIO = 1.25;
    const MAX_HOME_RATIO = 1.90;
    const IMAGE_DURATION = 5000;

    /* Fallback photos are used if the generated JSON is unavailable. */
    const FALLBACK_MEDIA = [
      "assets/img/activity/activity6.jpg",
      "assets/img/activity/activity5.jpg",
      "assets/img/activity/activity4.jpg",
      "assets/img/activity/activity3.jpg",
      "assets/img/activity/activity2.jpg",
      "assets/img/activity/activity1.jpg"
    ];



    function createNewsElement(item){
      const details = document.createElement("details");
      details.className = "news-item";

      const summary = document.createElement("summary");
      summary.className = "news-summary";

      const date = document.createElement("span");
      date.className = "news-date";
      date.textContent = item.date;

      const main = document.createElement("span");
      main.className = "news-summary-main";

      const titleRow = document.createElement("span");
      titleRow.className = "news-title-row";

      if(item.highlight){
        const badge = document.createElement("span");
        badge.className = "news-badge";
        badge.textContent = "Highlight";
        titleRow.appendChild(badge);
      }

      const title = document.createElement("span");
      title.className = "news-title";
      title.textContent = item.title;
      titleRow.appendChild(title);
      main.appendChild(titleRow);

      const category = document.createElement("span");
      category.className = "news-category";
      category.textContent = item.category;
      main.appendChild(category);

      const chevron = document.createElement("span");
      chevron.className = "news-chevron";
      chevron.setAttribute("aria-hidden", "true");

      summary.append(date, main, chevron);
      details.appendChild(summary);

      const detail = document.createElement("div");
      detail.className = "news-detail";

      if(item.paperTitle){
        const paperTitle = document.createElement("p");
        paperTitle.className = "news-paper-title";
        paperTitle.textContent = item.paperTitle;
        detail.appendChild(paperTitle);
      }

      const body = document.createElement("p");
      body.textContent = item.body;
      detail.appendChild(body);

      if(Array.isArray(item.papers) && item.papers.length){
        const paperList = document.createElement("ul");
        paperList.className = "news-paper-list";
        item.papers.forEach(text => {
          const li = document.createElement("li");
          li.textContent = text;
          paperList.appendChild(li);
        });
        detail.appendChild(paperList);
      }

      if(item.venue){
        const venue = document.createElement("p");
        venue.className = "news-venue";
        venue.textContent = item.venue;
        detail.appendChild(venue);
      }

      if(Array.isArray(item.links) && item.links.length){
        const links = document.createElement("div");
        links.className = "news-links";
        item.links.forEach(link => {
          const a = document.createElement("a");
          a.href = link.url;
          a.textContent = `${link.label} ↗`;
          if(/^https?:\/\//i.test(link.url)){
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
          links.appendChild(a);
        });
        detail.appendChild(links);
      }

      details.appendChild(detail);
      return details;
    }

    function initializeHomeNews(){
      const list = document.getElementById("homeNewsList");
      if(!list || !Array.isArray(globalThis.AIVS_NEWS)) return;
      globalThis.AIVS_NEWS.slice(0, HOME_NEWS_LIMIT).forEach(item => {
        list.appendChild(createNewsElement(item));
      });
    }

    const carouselSection = document.getElementById("homeCarouselSection");
    const carousel = document.getElementById("homeCarousel");
    const track = document.getElementById("carouselTrack");
    const dotsContainer = document.getElementById("carouselDots");
    const prevButton = document.getElementById("carouselPrev");
    const nextButton = document.getElementById("carouselNext");

    let homeMedia = [];
    let currentIndex = 0;
    let autoTimer = null;
    let touchStartX = 0;

    function activityNumber(src){
      const match = src.match(/activity(\d+)\.[a-z0-9]+$/i);
      return match ? Number(match[1]) : null;
    }

    function normalizeHomeMedia(media){
      const clean = [...new Set(
        media.filter(src => typeof src === "string" && src.trim() !== "")
      )];

      if(clean.length > 0 && clean.every(src => activityNumber(src) !== null)){
        clean.sort((a, b) => activityNumber(b) - activityNumber(a));
      }

      return clean;
    }

    function inspectImage(src){
      return new Promise(resolve => {
        const image = new Image();

        image.onload = () => {
          const ratio = image.naturalWidth / image.naturalHeight;
          const eligible =
            image.naturalWidth > image.naturalHeight &&
            ratio >= MIN_HOME_RATIO &&
            ratio <= MAX_HOME_RATIO;

          resolve(eligible ? src : null);
        };

        image.onerror = () => resolve(null);
        image.src = src;
      });
    }

    async function keepEligibleLandscapePhotos(media){
      const inspected = await Promise.all(media.map(inspectImage));
      return inspected.filter(Boolean).slice(0, MAX_HOME_MEDIA);
    }

    async function loadHomeMedia(){
      let candidates;

      try{
        const response = await fetch(HOME_MEDIA_JSON, { cache: "no-store" });
        if(!response.ok){
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        if(!data || !Array.isArray(data.media) || data.media.length === 0){
          throw new Error("No media entries found");
        }

        candidates = normalizeHomeMedia(data.media);
      }catch(error){
        console.warn("Using fallback activity photos:", error);
        candidates = normalizeHomeMedia(FALLBACK_MEDIA);
      }

      return keepEligibleLandscapePhotos(candidates);
    }

    function createSlides(){
      track.innerHTML = "";
      dotsContainer.innerHTML = "";

      homeMedia.forEach((src, index) => {
        const slide = document.createElement("div");
        slide.className = "carousel-slide";
        slide.setAttribute("role", "group");
        slide.setAttribute("aria-roledescription", "slide");
        slide.setAttribute("aria-label", `${index + 1} of ${homeMedia.length}`);

        const image = document.createElement("img");
        image.src = src;
        image.alt = `AIVS Lab activity ${index + 1}`;
        image.loading = index === 0 ? "eager" : "lazy";
        image.decoding = "async";

        slide.appendChild(image);
        track.appendChild(slide);

        const dot = document.createElement("button");
        dot.className = "carousel-dot";
        dot.type = "button";
        dot.setAttribute("aria-label", `Go to photo ${index + 1}`);
        dot.addEventListener("click", () => showSlide(index));
        dotsContainer.appendChild(dot);
      });

      /* The number of pagination dots always matches the number of photos. */
      const singlePhoto = homeMedia.length <= 1;
      prevButton.hidden = singlePhoto;
      nextButton.hidden = singlePhoto;
      dotsContainer.hidden = singlePhoto;
    }

    function scheduleNext(){
      clearTimeout(autoTimer);

      if(
        homeMedia.length <= 1 ||
        window.matchMedia("(prefers-reduced-motion: reduce)").matches
      ){
        return;
      }

      autoTimer = window.setTimeout(() => {
        showSlide(currentIndex + 1);
      }, IMAGE_DURATION);
    }

    function showSlide(index){
      if(homeMedia.length === 0){
        return;
      }

      clearTimeout(autoTimer);
      currentIndex = (index + homeMedia.length) % homeMedia.length;

      const slides = Array.from(track.children);
      const dots = Array.from(dotsContainer.children);

      slides.forEach((slide, i) => {
        const active = i === currentIndex;
        slide.classList.toggle("is-active", active);
        slide.setAttribute("aria-hidden", String(!active));
      });

      dots.forEach((dot, i) => {
        const active = i === currentIndex;
        dot.classList.toggle("is-active", active);
        if(active){
          dot.setAttribute("aria-current", "true");
        }else{
          dot.removeAttribute("aria-current");
        }
      });

      scheduleNext();
    }

    function showNext(){
      showSlide(currentIndex + 1);
    }

    function showPrevious(){
      showSlide(currentIndex - 1);
    }

    prevButton.addEventListener("click", showPrevious);
    nextButton.addEventListener("click", showNext);

    carousel.addEventListener("keydown", event => {
      if(event.key === "ArrowLeft"){
        showPrevious();
      }else if(event.key === "ArrowRight"){
        showNext();
      }
    });

    carousel.addEventListener("touchstart", event => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    carousel.addEventListener("touchend", event => {
      const touchEndX = event.changedTouches[0].clientX;
      const distance = touchEndX - touchStartX;

      if(Math.abs(distance) < 45){
        return;
      }

      distance > 0 ? showPrevious() : showNext();
    }, { passive: true });

    async function initializeCarousel(){
      homeMedia = await loadHomeMedia();

      if(homeMedia.length === 0){
        carouselSection.hidden = true;
        return;
      }

      createSlides();
      showSlide(0);
    }

    initializeCarousel();

    initializeHomeNews();
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
